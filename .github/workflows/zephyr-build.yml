name: Zephyr Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      attestations: write

    defaults:
      run:
        shell: pwsh
        working-directory: source

    env:
      HUSKY: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Visual C++ x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup Rust
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Verify external patcher inputs
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($n in @('ltk_patcher_host.exe', 'ltk_patcher_dll.dll')) {
            $f = 'src-tauri\resources\' + $n
            $lines = @(Get-Content SHA256SUMS.txt | Where-Object {
              $_.EndsWith('  ' + $f)
            })
            if ($lines.Count -ne 1) {
              throw "Missing recorded hash: $n"
            }
            $expected = ($lines[0] -split '\s+')[0]
            $actual = (Get-FileHash $f -Algorithm SHA256).Hash
            if ($actual -ine $expected) {
              throw "Hash mismatch: $n"
            }
            $signature = Get-AuthenticodeSignature $f
            if ($signature.Status -ne 'NotSigned') {
              throw "Expected unsigned patcher input: $n"
            }
            Write-Host "Verified external binary: $n"
          }

      - name: Build menu from source
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'src-tauri/resources/r3nz' | Out-Null
          $out = ($env:GITHUB_WORKSPACE -replace '\\', '/') + '/source/zephyr-menu-build/'
          & msbuild.exe 'zephyr-menu-source/R3nzSkin/R3nzSkin.vcxproj' /m /p:Configuration=RiotGamesServers /p:Platform=x64 /p:TargetName=ZephyrMenu "/p:OutDir=$out"
          if ($LASTEXITCODE -ne 0) {
            throw 'Menu compilation failed'
          }
          Copy-Item 'zephyr-menu-build/ZephyrMenu.dll' 'src-tauri/resources/r3nz/R3nzSkin.dll'

      - name: Include licenses in installer
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json -AsHashtable
          $licenses = @{
            '../LICENSE' = 'licenses/GPL-3.0.txt'
            '../R3NZ-LICENSE' = 'licenses/R3nzSkin-MIT.txt'
            '../LTK-PATCHER-LICENSE.md' = 'licenses/LTK-PATCHER-LICENSE.md'
            '../THIRD_PARTY_NOTICES.md' = 'licenses/THIRD_PARTY_NOTICES.md'
          }
          foreach ($source in $licenses.Keys) {
            if (!(Test-Path (Join-Path 'src-tauri' $source))) {
              throw "Missing license: $source"
            }
            $config.bundle.resources[$source] = $licenses[$source]
          }
          $config | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
          key: zephyr-rust-${{ runner.os }}-${{ hashFiles('source/Cargo.lock', 'source/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            zephyr-rust-${{ runner.os }}-${{ hashFiles('source/Cargo.lock', 'source/**/Cargo.toml') }}-

      - name: Build loader, run checks and build installer
        run: |
          $ErrorActionPreference = 'Stop'
          & ./BUILD.ps1

      - name: Prepare download package
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'release-files' | Out-Null
          $installers = @(Get-ChildItem 'target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) {
            throw 'Expected exactly one installer'
          }
          Copy-Item $installers[0].FullName 'release-files/'
          Copy-Item LICENSE,R3NZ-LICENSE,LTK-PATCHER-LICENSE.md,THIRD_PARTY_NOTICES.md,SECURITY.md 'release-files/'
          @(
            "Repository: $env:GITHUB_REPOSITORY"
            "Commit: $env:GITHUB_SHA"
            "Run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            'The LeagueToolkit patcher is a precompiled external component.'
            'Build provenance does not constitute a security audit.'
          ) | Set-Content 'release-files/BUILD-INFO.txt' -Encoding utf8
          $hashes = @(Get-ChildItem 'release-files' -File | Sort-Object Name | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            $h.Hash.ToLower() + '  ' + $_.Name
          })
          $hashes | Set-Content 'release-files/SHA256SUMS.txt' -Encoding ascii

      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: source/release-files/*-setup.exe

      - name: Upload installer and notices
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-Windows-${{ github.sha }}
          path: source/release-files/
          if-no-files-found: error
          retention-days: 30